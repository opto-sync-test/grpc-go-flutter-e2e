name: grpc_go_flutter_e2e
description: Flutter gRPC client exercising the pinned Opto-Sync Go engine.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  fixnum: ^1.1.1
  grpc: ^5.1.0
  opto_sync_client:
    path: ../vendor/opto-sync-clients/clients/dart
  protobuf: ^6.0.0
  workmanager: ^0.10.7
  workmanager_web: ^0.2.0

# workmanager_apple 0.9.10 references Xcode 26 BackgroundTasks symbols even
# when building with the currently hosted Xcode toolchain. 0.9.9 implements the
# same iOS/macOS plugin contract without that unavailable API surface.
dependency_overrides:
  workmanager_apple: 0.9.9

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
